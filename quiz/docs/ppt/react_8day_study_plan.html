
<style>
  .plan-wrap { padding: 1rem 0; font-family: var(--font-sans); }
  .day-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); margin-bottom: 12px; overflow: hidden; cursor: pointer; transition: border-color .2s; }
  .day-card:hover { border-color: var(--color-border-secondary); }
  .day-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
  .day-left { display: flex; align-items: center; gap: 12px; }
  .day-num { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px; }
  .day-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
  .day-sub { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
  .chevron { font-size: 14px; color: var(--color-text-tertiary); transition: transform .2s; }
  .chevron.open { transform: rotate(180deg); }
  .day-body { display: none; border-top: 0.5px solid var(--color-border-tertiary); padding: 12px 16px 16px; }
  .day-body.open { display: block; }
  .topic-list { list-style: none; margin: 0; padding: 0; }
  .topic-list li { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; font-size: 13px; color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); }
  .topic-list li:last-child { border-bottom: none; }
  .topic-dot { margin-top: 5px; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: auto; flex-shrink: 0; }
  .tip-box { margin-top: 12px; background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 12px; font-size: 12px; color: var(--color-text-secondary); }
  .ask-btn { margin-top: 12px; font-size: 12px; background: none; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 6px 12px; cursor: pointer; color: var(--color-text-secondary); }
  .ask-btn:hover { background: var(--color-background-secondary); }
  .legend { display: flex; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-secondary); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
</style>
<div class="plan-wrap">
  <h2 style="sr-only">React 8-Day Study Plan</h2>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#534AB7"></div>Concept</div>
    <div class="legend-item"><div class="legend-dot" style="background:#0F6E56"></div>Practice</div>
    <div class="legend-item"><div class="legend-dot" style="background:#993C1D"></div>Project</div>
  </div>

  <div id="days"></div>
</div>
<script>
const days = [
  {
    num: "Day 1",
    title: "React Fundamentals",
    sub: "What React is and how it thinks",
    color: { bg: "#EEEDFE", text: "#534AB7", dot: "#534AB7" },
    topics: [
      { text: "Why React? DOM vs Virtual DOM", tag: "concept" },
      { text: "Setting up with Vite (create-vite)", tag: "practice" },
      { text: "JSX syntax — HTML inside JS, rules & differences", tag: "concept" },
      { text: "Your first functional component", tag: "practice" },
      { text: "Props — passing data into components", tag: "concept" },
      { text: "Rendering lists with .map() and keys", tag: "practice" },
    ],
    tip: "⏱ ~1.5 hrs. Focus on understanding JSX — it's not HTML, it compiles to JS function calls.",
    prompt: "Explain JSX rules and how it differs from HTML"
  },
  {
    num: "Day 2",
    title: "State & Events",
    sub: "Making components interactive",
    color: { bg: "#EEEDFE", text: "#534AB7", dot: "#534AB7" },
    topics: [
      { text: "useState hook — reading and updating state", tag: "concept" },
      { text: "Event handlers — onClick, onChange, onSubmit", tag: "concept" },
      { text: "Controlled inputs (form elements tied to state)", tag: "practice" },
      { text: "Conditional rendering — &&, ternary, if/else", tag: "concept" },
      { text: "Mini project: Counter + toggle + form", tag: "project" },
    ],
    tip: "⏱ ~1.5 hrs. Build all three mini-projects — state only clicks in by doing.",
    prompt: "Give me a practice exercise using useState with a form"
  },
  {
    num: "Day 3",
    title: "Component Design",
    sub: "Thinking in components",
    color: { bg: "#E1F5EE", text: "#0F6E56", dot: "#0F6E56" },
    topics: [
      { text: "Component composition — children prop", tag: "concept" },
      { text: "Lifting state up — sharing state between siblings", tag: "concept" },
      { text: "Prop drilling — what it is, why it's a problem", tag: "concept" },
      { text: "Reusable components (Button, Card, Modal)", tag: "practice" },
      { text: "Styling — CSS Modules or Tailwind basics", tag: "practice" },
    ],
    tip: "⏱ ~1.5 hrs. Build a reusable Card component with a slot for any content.",
    prompt: "Show me an example of lifting state up with two sibling components"
  },
  {
    num: "Day 4",
    title: "useEffect & Data Fetching",
    sub: "Side effects and APIs",
    color: { bg: "#E1F5EE", text: "#0F6E56", dot: "#0F6E56" },
    topics: [
      { text: "useEffect hook — what a side effect is", tag: "concept" },
      { text: "Dependency array — [], [value], no array", tag: "concept" },
      { text: "Cleanup function — timers, subscriptions", tag: "concept" },
      { text: "Fetching data from an API with fetch + async/await", tag: "practice" },
      { text: "Loading & error states pattern", tag: "practice" },
      { text: "Mini project: Fetch a public API (e.g. JSONPlaceholder)", tag: "project" },
    ],
    tip: "⏱ ~1.5 hrs. The dependency array is the most misunderstood part — spend extra time here.",
    prompt: "Explain the useEffect dependency array with examples of each case"
  },
  {
    num: "Day 5",
    title: "React Router",
    sub: "Multi-page navigation",
    color: { bg: "#FAECE7", text: "#993C1D", dot: "#993C1D" },
    topics: [
      { text: "Installing React Router v6", tag: "practice" },
      { text: "BrowserRouter, Routes, Route setup", tag: "concept" },
      { text: "Link and NavLink components", tag: "concept" },
      { text: "useNavigate and useParams hooks", tag: "concept" },
      { text: "Nested routes and layouts", tag: "concept" },
      { text: "404 page / catch-all routes", tag: "practice" },
    ],
    tip: "⏱ ~1.5 hrs. Build a 3-page app: Home → List → Detail with URL params.",
    prompt: "Show me how to set up React Router v6 with nested routes"
  },
  {
    num: "Day 6",
    title: "Context & State Management",
    sub: "Sharing state without prop drilling",
    color: { bg: "#FAECE7", text: "#993C1D", dot: "#993C1D" },
    topics: [
      { text: "useContext hook — creating and consuming context", tag: "concept" },
      { text: "Context Provider pattern", tag: "concept" },
      { text: "useReducer — for complex state logic", tag: "concept" },
      { text: "When to use Context vs local state", tag: "concept" },
      { text: "Mini project: Theme toggle or Cart context", tag: "project" },
    ],
    tip: "⏱ ~1.5 hrs. Context is not a replacement for all state — only truly shared state.",
    prompt: "Build a simple cart context with useContext and useReducer"
  },
  {
    num: "Day 7",
    title: "Advanced Hooks & Patterns",
    sub: "Optimisation and custom logic",
    color: { bg: "#E1F5EE", text: "#0F6E56", dot: "#0F6E56" },
    topics: [
      { text: "useRef — DOM access, persist values across renders", tag: "concept" },
      { text: "useMemo — expensive computation caching", tag: "concept" },
      { text: "useCallback — stable function references", tag: "concept" },
      { text: "Custom hooks — extracting reusable logic (useFetch, useLocalStorage)", tag: "practice" },
      { text: "React.memo — preventing unnecessary re-renders", tag: "concept" },
    ],
    tip: "⏱ ~1.5 hrs. Don't over-optimise — use useMemo/useCallback only when you see a problem.",
    prompt: "When should I use useCallback vs useMemo? Give examples"
  },
  {
    num: "Day 8",
    title: "Final Project Day",
    sub: "Put everything together",
    color: { bg: "#FAEEDA", text: "#854F0B", dot: "#BA7517" },
    topics: [
      { text: "Plan a small full app (e.g. Notes app, Movie search, Weather app)", tag: "project" },
      { text: "Multiple routes — Home, List, Detail", tag: "project" },
      { text: "API data fetching with loading/error states", tag: "project" },
      { text: "Context for global state (e.g. favorites, theme)", tag: "project" },
      { text: "At least 1 custom hook", tag: "project" },
      { text: "Clean folder structure: components/, pages/, hooks/", tag: "practice" },
    ],
    tip: "⏱ ~1.5 hrs. Don't start from scratch — combine pieces you already built this week.",
    prompt: "Give me project ideas for a beginner React final project using an API"
  }
];

const tagStyle = {
  concept: { bg: "#EEEDFE", text: "#534AB7" },
  practice: { bg: "#E1F5EE", text: "#0F6E56" },
  project: { bg: "#FAECE7", text: "#993C1D" },
};

const container = document.getElementById('days');
days.forEach((day, i) => {
  const card = document.createElement('div');
  card.className = 'day-card';
  card.innerHTML = `
    <div class="day-header" onclick="toggle(${i})">
      <div class="day-left">
        <span class="day-num" style="background:${day.color.bg};color:${day.color.text}">${day.num}</span>
        <div>
          <div class="day-title">${day.title}</div>
          <div class="day-sub">${day.sub}</div>
        </div>
      </div>
      <i class="ti ti-chevron-down chevron" id="chev-${i}" aria-hidden="true"></i>
    </div>
    <div class="day-body" id="body-${i}">
      <ul class="topic-list">
        ${day.topics.map(t => `
          <li>
            <div class="topic-dot" style="background:${tagStyle[t.tag].bg};outline:1.5px solid ${tagStyle[t.tag].text};outline-offset:0"></div>
            <span>${t.text}</span>
            <span class="tag" style="background:${tagStyle[t.tag].bg};color:${tagStyle[t.tag].text}">${t.tag}</span>
          </li>
        `).join('')}
      </ul>
      <div class="tip-box">${day.tip}</div>
      <button class="ask-btn" onclick="event.stopPropagation(); sendPrompt('${day.prompt}')">Ask Claude about Day ${i+1} ↗</button>
    </div>
  `;
  container.appendChild(card);
});

function toggle(i) {
  const body = document.getElementById('body-' + i);
  const chev = document.getElementById('chev-' + i);
  body.classList.toggle('open');
  chev.classList.toggle('open');
}
</script>
